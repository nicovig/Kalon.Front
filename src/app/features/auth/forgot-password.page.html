<div class="login-shell">
  <div class="login-panel">
    <div class="login-header">
      <div class="login-logo-wrap" aria-hidden="true">
        <img src="/assets/img/logo_rounded.png" alt="Kalon" class="login-logo" />
      </div>
      <h1 class="login-title">Mot de passe oublié</h1>
      <p class="login-sub">Saisissez l’adresse e-mail de votre compte pour recevoir un lien de réinitialisation.</p>
    </div>

    @if (sent) {
      <p class="login-success" role="status">{{ sentMessage }}</p>
      <div class="login-actions-secondary">
        <a routerLink="/auth/login" class="login-link">Retour à la connexion</a>
      </div>
    } @else {
      <form class="login-form" (ngSubmit)="onSubmit()">
        <form-text-component
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="Adresse email"
          [required]="true"
          icon="📧"
          [(ngModel)]="email"
          width="100%"
        />

        @if (errorMessage) {
          <p class="login-error" role="alert">{{ errorMessage }}</p>
        }

        <button type="submit" class="login-button" [disabled]="submitting">
          {{ submitting ? 'Envoi…' : 'Envoyer le lien' }}
        </button>
      </form>

      <div class="login-actions-secondary">
        <a routerLink="/auth/login" class="login-link">Retour à la connexion</a>
      </div>
    }
  </div>
</div>
