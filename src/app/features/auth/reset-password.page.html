<div class="login-shell">
  <div class="login-panel">
    <div class="login-header">
      <div class="login-logo-wrap" aria-hidden="true">
        <img src="/assets/img/logo_rounded.png" alt="Kalon" class="login-logo" />
      </div>
      <h1 class="login-title">Nouveau mot de passe</h1>
      <p class="login-sub">Choisissez un nouveau mot de passe pour votre compte Kalon.</p>
    </div>

    @if (!token) {
      <p class="login-error" role="alert">Ce lien de réinitialisation est incomplet.</p>
      <div class="login-actions-secondary">
        <a routerLink="/forgot-password" class="login-link">Demander un nouveau lien</a>
        <a routerLink="/auth/login" class="login-link">Retour à la connexion</a>
      </div>
    } @else {
      <form class="login-form" (ngSubmit)="onSubmit()">
        <form-text-component
          id="newPassword"
          name="newPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Nouveau mot de passe"
          [allowPasswordToggle]="true"
          [required]="true"
          [(ngModel)]="newPassword"
          width="100%"
        />

        <form-text-component
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Confirmer le mot de passe"
          [allowPasswordToggle]="true"
          [required]="true"
          [(ngModel)]="confirmPassword"
          width="100%"
        />

        @if (errorMessage) {
          <p class="login-error" role="alert">{{ errorMessage }}</p>
        }

        <button type="submit" class="login-button" [disabled]="submitting">
          {{ submitting ? 'Réinitialisation…' : 'Réinitialiser' }}
        </button>
      </form>

      <div class="login-actions-secondary">
        <a routerLink="/forgot-password" class="login-link">Demander un nouveau lien</a>
        <a routerLink="/auth/login" class="login-link">Retour à la connexion</a>
      </div>
    }
  </div>
</div>
